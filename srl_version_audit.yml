---
- name: Nokia SR Linux - Software Version Audit
  hosts: all
  gather_facts: false
  vars:
    ansible_connection: ssh
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  tasks:
    - name: Get full version output via SR Linux CLI
      ansible.builtin.raw: "show version"
      register: version_out
      changed_when: false
      failed_when: false

    - name: Emit parsed software version line (if available)
      ansible.builtin.debug:
        msg: "SRL_VERSION: {{ inventory_hostname }}: {{ (version_out.stdout | regex_search('(?m)^Software.*')) | default('N/A') }}" 
